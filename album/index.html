<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>相册集 | 宸宇的website</title>
    <style>
        :root {
            --primary: #4299e1;
            --primary-light: rgba(66, 153, 225, 0.15);
            --primary-shadow: rgba(66, 153, 225, 0.25);
            --bg: linear-gradient(150deg, #f8fafc, #f1f5f9);
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.03);
            --shadow-heavy: 0 15px 30px rgba(0, 0, 0, 0.08);
            --shadow-primary: 0 8px 20px var(--primary-shadow);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", "微软雅黑", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-main);
            padding-bottom: env(safe-area-inset-bottom);
            touch-action: manipulation;
            overflow: hidden;
            position: relative;
        }

        #bgMusic { display: none; }

        .top-right-group {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .music-wrapper {
            position: relative;
            width: 56px;
            height: 56px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .music-wrapper svg {
            position: absolute;
            top: -2px;
            left: -2px;
            width: 60px;
            height: 60px;
            transform: rotate(-90deg);
        }
        .music-wrapper svg circle {
            fill: none;
            stroke: var(--primary);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 163.36;
            stroke-dashoffset: 163.36;
            transition: stroke-dashoffset 0.3s ease, opacity 0.4s ease;
        }
        .music-wrapper svg circle.bg-circle {
            stroke: rgba(66, 153, 225, 0.15);
            stroke-dashoffset: 0;
            opacity: 0;
        }
        .music-wrapper.show-progress svg circle.bg-circle {
            opacity: 1;
        }

        .ctrl-btn {
            position: absolute;
            top: 0;
            left: 0;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--primary);
            outline: none;
            font-family: "Inter", "微软雅黑", system-ui, sans-serif;
            font-weight: 600;
            transition: all 0.3s;
            user-select: none;
            z-index: 2;
            position: relative;
        }
        .ctrl-btn:hover {
            transform: scale(1.08);
            box-shadow: var(--shadow-primary);
            border-color: var(--primary);
        }
        .ctrl-btn:active { transform: scale(0.92); }

        .retract-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: var(--primary);
            outline: none;
            transition: all 0.3s;
            user-select: none;
            flex-shrink: 0;
        }
        .retract-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-primary);
            border-color: var(--primary);
        }
        .retract-btn:active { transform: scale(0.95); }

        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            font-size: 20px;
            color: var(--primary);
            text-decoration: none;
            transition: all 0.3s;
        }
        .back-home:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-primary);
            border-color: var(--primary);
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
            pointer-events: none;
            width: 100%;
        }
        .page-title h1 {
            font-size: clamp(28px, 7vmin, 42px);
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--text-main), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .page-title p {
            color: var(--text-secondary);
            font-size: clamp(13px, 3vmin, 16px);
        }

        .card-stack-wrap {
            position: relative;
            width: min(80vw, 420px);
            height: min(60vh, 560px);
        }

        .photo-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #f0f4f8;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .photo-card:active { cursor: grabbing; }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            background-color: #f0f4f8;
        }
        .photo-card img::after {
            content: "📷 图片加载失败";
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #f0f4f8;
            color: #94a3b8;
            font-size: 16px;
        }

        .footer-text {
            position: fixed;
            bottom: 30px;
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.active { display: flex; }
        .modal-overlay img {
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            background: #111;
        }
        .modal-overlay .close-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .modal-overlay .close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 768px) {
            body { padding: 30px 16px; }
            .back-home {
                width: 44px;
                height: 44px;
                font-size: 17px;
                top: 14px;
                left: 14px;
            }
            .top-right-group {
                top: 14px;
                right: 14px;
                gap: 10px;
            }
            .music-wrapper {
                width: 48px;
                height: 48px;
            }
            .music-wrapper svg {
                width: 52px;
                height: 52px;
                top: -2px;
                left: -2px;
            }
            .music-wrapper svg circle {
                stroke-width: 2.5;
            }
            .ctrl-btn {
                width: 48px;
                height: 48px;
                font-size: 19px;
            }
            .retract-btn {
                width: 40px;
                height: 40px;
                font-size: 17px;
            }
            .page-title { margin-bottom: 30px; }
            .card-stack-wrap {
                width: min(80vw, 420px);
                height: min(60vh, 560px);
            }
            .modal-overlay .close-btn {
                top: 20px;
                right: 20px;
                width: 44px;
                height: 44px;
                font-size: 24px;
            }
            .footer-text {
                bottom: 20px;
                font-size: 12px;
            }
        }
        @media (max-width: 375px) {
            .top-right-group {
                top: 12px;
                right: 12px;
                gap: 8px;
            }
            .music-wrapper {
                width: 42px;
                height: 42px;
            }
            .music-wrapper svg {
                width: 46px;
                height: 46px;
                top: -2px;
                left: -2px;
            }
            .music-wrapper svg circle {
                stroke-width: 2.2;
            }
            .ctrl-btn {
                width: 42px;
                height: 42px;
                font-size: 17px;
            }
            .retract-btn {
                width: 36px;
                height: 36px;
                font-size: 15px;
            }
            .card-stack-wrap {
                width: 85vw;
                height: 55vh;
            }
        }
    </style>
</head>
<body>
    <a href="../" class="back-home">←</a>

    <div class="top-right-group">
        <div class="music-wrapper" id="musicWrapper">
            <svg viewBox="0 0 60 60">
                <circle class="bg-circle" cx="30" cy="30" r="26" />
                <circle class="fg-circle" cx="30" cy="30" r="26" />
            </svg>
            <div class="ctrl-btn" id="musicBtn" tabindex="0">🎵</div>
        </div>
        <div class="retract-btn" id="retractBtn" tabindex="0" title="收回全部照片">↩️</div>
    </div>

    <audio id="bgMusic" loop preload="auto" style="display:none;">
        <source src="../music/BGM3.mp3" type="audio/mpeg">
        你的浏览器不支持音频播放
    </audio>

    <div class="page-title">
        <h1>我的相册</h1>
        <p>拖动抽出 · 点击放大 · 点击右上角收回</p>
    </div>

    <div class="card-stack-wrap" id="stackWrap"></div>

    <div class="footer-text">© 2026 宸宇的website</div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="close-btn" id="modalCloseBtn">✕</div>
        <img id="modalImage" src="" alt="放大查看">
    </div>

    <script>
        // ========== 图片数据 ==========
        const imageList = [
            { id: 'rx7FnGtc', url: 'https://s3.bmp.ovh/2026/06/16/rx7FnGtc.jpg', alt: '照片1' },
            { id: 'KyH1p6Jj', url: 'https://s3.bmp.ovh/2026/06/16/KyH1p6Jj.jpg', alt: '照片2' },
            { id: 'bMcRwJz6', url: 'https://s3.bmp.ovh/2026/06/16/bMcRwJz6.jpg', alt: '照片3' },
            { id: 'u93BUguW', url: 'https://s3.bmp.ovh/2026/06/16/u93BUguW.jpg', alt: '照片4' },
            { id: 'NGXPlw9M', url: 'https://s3.bmp.ovh/2026/06/16/NGXPlw9M.jpg', alt: '照片5' },
            { id: 'jgaKQTGi', url: 'https://s3.bmp.ovh/2026/06/16/jgaKQTGi.jpg', alt: '照片6' },
            { id: 'PDSW7YA6', url: 'https://s3.bmp.ovh/2026/06/16/PDSW7YA6.jpg', alt: '照片7' },
            { id: 'EBczgeOs', url: 'https://s3.bmp.ovh/2026/06/16/EBczgeOs.jpg', alt: '照片8' },
            { id: '4jR3jIga', url: 'https://s3.bmp.ovh/2026/06/16/4jR3jIga.jpg', alt: '照片9' },
            { id: '1nl9SsQU', url: 'https://s3.bmp.ovh/2026/06/16/1nl9SsQU.jpg', alt: '照片10' },
            { id: 'Tc5ve5Op', url: 'https://s3.bmp.ovh/2026/06/16/Tc5ve5Op.jpg', alt: '照片11' },
            { id: 'UJaeQlPn', url: 'https://s3.bmp.ovh/2026/06/16/UJaeQlPn.jpg', alt: '照片12' }
        ];

        // ========== 相册交互 ==========
        const wrap = document.getElementById('stackWrap');
        let stackedCards = [];
        let freeCards = [];
        let dragData = null;
        const DRAG_THRESHOLD = 8;
        const OFFSET_X = 6;
        const OFFSET_ROTATE = 2.5;

        function createCard(data, index) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.dataset.id = data.id;
            card.dataset.index = index;
            card.style.position = 'absolute';
            card.style.width = '100%';
            card.style.height = '100%';

            const img = document.createElement('img');
            img.src = data.url;
            img.alt = data.alt;
            img.loading = 'eager';
            img.decoding = 'async';
            card.appendChild(img);

            card.addEventListener('mousedown', onPointerDown);
            card.addEventListener('touchstart', onPointerDown, { passive: false });

            return card;
        }

        function layoutStack() {
            const count = stackedCards.length;
            stackedCards.forEach((card, idx) => {
                const base = count - idx - 1;
                const tx = base * OFFSET_X;
                const ty = base * OFFSET_X;
                const rot = base * OFFSET_ROTATE;
                card.style.zIndex = idx + 1;
                card.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg)`;
                card.style.opacity = '1';
                card.style.pointerEvents = 'auto';
            });
        }

        function onPointerDown(e) {
            e.preventDefault();
            const card = e.currentTarget;
            const touch = e.touches ? e.touches[0] : e;
            const startX = touch.clientX;
            const startY = touch.clientY;

            card.style.transition = 'none';

            dragData = {
                card: card,
                startX: startX,
                startY: startY,
                moved: false,
                offsetX: 0,
                offsetY: 0,
                transformX: 0,
                transformY: 0
            };

            const rect = card.getBoundingClientRect();
            const wrapRect = wrap.getBoundingClientRect();
            dragData.offsetX = rect.left - wrapRect.left;
            dragData.offsetY = rect.top - wrapRect.top;

            card.style.zIndex = 9999;

            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            document.addEventListener('touchmove', onPointerMove, { passive: false });
            document.addEventListener('touchend', onPointerUp);
            document.addEventListener('touchcancel', onPointerUp);
        }

        function onPointerMove(e) {
            if (!dragData) return;
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            const dx = touch.clientX - dragData.startX;
            const dy = touch.clientY - dragData.startY;

            if (!dragData.moved && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
                dragData.moved = true;
            }

            if (dragData.moved) {
                const card = dragData.card;
                const newX = dragData.offsetX + dx;
                const newY = dragData.offsetY + dy;
                card.style.transform = `translate(${newX}px, ${newY}px) scale(1.04) rotate(0deg)`;
                dragData.transformX = newX;
                dragData.transformY = newY;
            }
        }

        function onPointerUp(e) {
            if (!dragData) return;
            const card = dragData.card;
            const moved = dragData.moved;

            document.removeEventListener('mousemove', onPointerMove);
            document.removeEventListener('mouseup', onPointerUp);
            document.removeEventListener('touchmove', onPointerMove);
            document.removeEventListener('touchend', onPointerUp);
            document.removeEventListener('touchcancel', onPointerUp);

            card.style.transition = '';

            if (!moved) {
                openModal(card.querySelector('img').src);
                dragData = null;
                return;
            }

            const idxInStack = stackedCards.indexOf(card);
            if (idxInStack !== -1) {
                stackedCards.splice(idxInStack, 1);
                freeCards.push(card);
                wrap.removeChild(card);
                wrap.appendChild(card);
                card.style.transform = `translate(${dragData.transformX}px, ${dragData.transformY}px) scale(1) rotate(0deg)`;
                card.style.zIndex = 1000 + freeCards.length;
                layoutStack();
                freeCards.forEach((fc, i) => {
                    fc.style.zIndex = 1000 + i;
                });
            } else {
                card.style.transform = `translate(${dragData.transformX}px, ${dragData.transformY}px) scale(1) rotate(0deg)`;
            }

            dragData = null;
        }

        function retractAllCards() {
            if (freeCards.length === 0) return;
            freeCards.forEach(card => {
                stackedCards.push(card);
            });
            freeCards = [];
            stackedCards.sort((a, b) => Number(a.dataset.index) - Number(b.dataset.index));
            wrap.innerHTML = '';
            stackedCards.forEach(card => wrap.appendChild(card));
            stackedCards.forEach(card => {
                card.style.transition = '';
                card.style.zIndex = '';
            });
            layoutStack();
        }

        wrap.addEventListener('dblclick', function(e) {
            if (e.target.closest('.photo-card')) return;
            retractAllCards();
        });

        document.getElementById('retractBtn').addEventListener('click', retractAllCards);
        document.getElementById('retractBtn').addEventListener('touchstart', function(e) {
            e.preventDefault();
            retractAllCards();
        }, { passive: false });

        // ========== 模态框 ==========
        const modalOverlay = document.getElementById('modalOverlay');
        const modalImage = document.getElementById('modalImage');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        function openModal(src) {
            modalImage.src = src;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalCloseBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ========== 初始化相册 ==========
        function init() {
            const cards = imageList.map((data, idx) => createCard(data, idx));
            stackedCards = cards.slice();
            freeCards = [];
            cards.forEach(card => wrap.appendChild(card));
            layoutStack();

            imageList.forEach(data => {
                const img = new Image();
                img.src = data.url;
            });
        }
        init();

        // ========== 音乐控制（简洁可靠） ==========
        const musicBtn = document.getElementById('musicBtn');
        const bgMusic = document.getElementById('bgMusic');
        const musicWrapper = document.getElementById('musicWrapper');
        const fgCircle = document.querySelector('.fg-circle');
        const circumference = 2 * Math.PI * 26;

        let isPlaying = false;
        let isReady = false;

        // 更新进度环
        function updateProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            fgCircle.style.strokeDashoffset = offset;
            musicWrapper.classList.add('show-progress');
            if (percent >= 100) {
                setTimeout(() => {
                    musicWrapper.classList.remove('show-progress');
                }, 400);
            }
        }

        // 重置环（加载中状态）
        function resetProgress() {
            fgCircle.style.strokeDashoffset = circumference;
            musicWrapper.classList.add('show-progress');
        }

        // 开始加载音频
        bgMusic.load();

        // 监听加载进度
        bgMusic.addEventListener('progress', function() {
            if (bgMusic.buffered.length > 0) {
                const bufferedEnd = bgMusic.buffered.end(bgMusic.buffered.length - 1);
                const duration = bgMusic.duration;
                if (duration > 0 && !isReady) {
                    const percent = Math.min(Math.round((bufferedEnd / duration) * 100), 100);
                    updateProgress(percent);
                }
            }
        });

        // 加载完成可播放
        bgMusic.addEventListener('canplaythrough', function() {
            isReady = true;
            updateProgress(100); // 环满
            // 如果之前没有播放，按钮显示为播放状态
            if (!isPlaying) {
                musicBtn.textContent = '🎵';
            }
        });

        // 错误处理
        bgMusic.addEventListener('error', function() {
            musicBtn.textContent = '❌';
            musicBtn.style.color = '#ff4d4f';
            musicWrapper.classList.remove('show-progress');
        });

        // 播放/暂停切换
        function toggleMusic() {
            if (!isReady) {
                // 还没加载好，显示加载中
                resetProgress();
                // 如果还没开始加载，重新触发加载
                if (bgMusic.readyState === 0) {
                    bgMusic.load();
                }
                return;
            }

            if (isPlaying) {
                bgMusic.pause();
                musicBtn.textContent = '🎵';
                isPlaying = false;
            } else {
                bgMusic.play().then(() => {
                    musicBtn.textContent = '🔇';
                    isPlaying = true;
                }).catch(() => {
                    // 播放失败（比如自动播放被拦截），按钮不变，让用户再点一次
                    musicBtn.textContent = '🎵';
                });
            }
        }

        // 按钮事件
        musicBtn.addEventListener('click', toggleMusic);
        musicBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            toggleMusic();
        }, { passive: false });

        // 同步播放状态
        bgMusic.addEventListener('play', () => {
            isPlaying = true;
            musicBtn.textContent = '🔇';
        });
        bgMusic.addEventListener('pause', () => {
            isPlaying = false;
            musicBtn.textContent = '🎵';
        });

        // 首次点击页面任何地方尝试自动播放（仅一次）
        function firstInteraction() {
            if (isReady && !isPlaying) {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    musicBtn.textContent = '🔇';
                }).catch(() => {});
            }
            document.removeEventListener('click', firstInteraction);
            document.removeEventListener('touchstart', firstInteraction);
        }
        document.addEventListener('click', firstInteraction, { once: true });
        document.addEventListener('touchstart', firstInteraction, { once: true, passive: true });

        // 3秒后如果还未加载，强制触发加载（以防用户无交互）
        setTimeout(() => {
            if (!isReady && bgMusic.readyState === 0) {
                bgMusic.load();
                resetProgress();
            }
        }, 3000);
    </script>
