<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>相册集 | 宸宇的website</title>
    <style>
        /* ========== 全局样式 ========== */
        :root {
            --primary: #4299e1;
            --primary-light: rgba(66, 153, 225, 0.15);
            --primary-shadow: rgba(66, 153, 225, 0.25);
            --bg: linear-gradient(150deg, #f8fafc, #f1f5f9);
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.03);
            --shadow-heavy: 0 15px 30px rgba(0, 0, 0, 0.08);
            --shadow-primary: 0 8px 20px var(--primary-shadow);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", "微软雅黑", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            color: var(--text-main);
            padding-bottom: env(safe-area-inset-bottom);
            touch-action: manipulation;
            overflow: hidden;
            position: relative;
        }

        #bgMusic { display: none; }

        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            font-size: 20px;
            color: var(--primary);
            outline: none;
        }
        .music-control:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-primary);
            border-color: var(--primary);
        }
        .music-control:active { transform: scale(0.95); }

        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            font-size: 20px;
            color: var(--primary);
            text-decoration: none;
        }
        .back-home:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-primary);
            border-color: var(--primary);
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
            pointer-events: none;
        }
        .page-title h1 {
            font-size: clamp(28px, 7vmin, 42px);
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--text-main), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .page-title p {
            color: var(--text-secondary);
            font-size: clamp(13px, 3vmin, 16px);
        }

        .card-stack-wrap {
            position: relative;
            width: min(80vw, 420px);
            height: min(60vh, 560px);
            /* 双击空白区域触发收回 */
        }

        .photo-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #f0f4f8;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 默认启用过渡，拖拽时会被临时禁用 */
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .photo-card:active { cursor: grabbing; }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            background-color: #f0f4f8;
        }
        .photo-card img::after {
            content: "📷 图片加载失败";
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #f0f4f8;
            color: #94a3b8;
            font-size: 16px;
        }

        .footer-text {
            position: fixed;
            bottom: 30px;
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        /* ========== 模态框 ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.active { display: flex; }
        .modal-overlay img {
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            background: #111;
        }
        .modal-overlay .close-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .modal-overlay .close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 768px) {
            body { padding: 30px 12px; }
            .music-control, .back-home {
                width: 44px;
                height: 44px;
                font-size: 17px;
                top: 14px;
            }
            .page-title { margin-bottom: 30px; }
            .modal-overlay .close-btn {
                top: 20px;
                right: 20px;
                width: 44px;
                height: 44px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <a href="../" class="back-home">←</a>
    <div class="music-control" id="musicBtn" tabindex="0">🔇</div>

    <audio id="bgMusic" loop preload="auto" style="display:none;">
        <source src="../music/BGM3.mp3" type="audio/mpeg">
        你的浏览器不支持音频播放
    </audio>

    <div class="page-title">
        <h1>我的相册</h1>
        <p>拖动抽出 · 点击放大 · 双击空白处收回</p>
    </div>

    <div class="card-stack-wrap" id="stackWrap"></div>

    <div class="footer-text">© 2026 宸宇的website</div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="close-btn" id="modalCloseBtn">✕</div>
        <img id="modalImage" src="" alt="放大查看">
    </div>

    <script>
        // ============================================================
        // 1. 图片数据
        // ============================================================
        const imageList = [
            { id: 'rx7FnGtc', url: 'https://s3.bmp.ovh/2026/06/16/rx7FnGtc.jpg', alt: '照片1' },
            { id: 'KyH1p6Jj', url: 'https://s3.bmp.ovh/2026/06/16/KyH1p6Jj.jpg', alt: '照片2' },
            { id: 'bMcRwJz6', url: 'https://s3.bmp.ovh/2026/06/16/bMcRwJz6.jpg', alt: '照片3' },
            { id: 'u93BUguW', url: 'https://s3.bmp.ovh/2026/06/16/u93BUguW.jpg', alt: '照片4' },
            { id: 'NGXPlw9M', url: 'https://s3.bmp.ovh/2026/06/16/NGXPlw9M.jpg', alt: '照片5' },
            { id: 'jgaKQTGi', url: 'https://s3.bmp.ovh/2026/06/16/jgaKQTGi.jpg', alt: '照片6' },
            { id: 'PDSW7YA6', url: 'https://s3.bmp.ovh/2026/06/16/PDSW7YA6.jpg', alt: '照片7' },
            { id: 'EBczgeOs', url: 'https://s3.bmp.ovh/2026/06/16/EBczgeOs.jpg', alt: '照片8' },
            { id: '4jR3jIga', url: 'https://s3.bmp.ovh/2026/06/16/4jR3jIga.jpg', alt: '照片9' },
            { id: '1nl9SsQU', url: 'https://s3.bmp.ovh/2026/06/16/1nl9SsQU.jpg', alt: '照片10' },
            { id: 'Tc5ve5Op', url: 'https://s3.bmp.ovh/2026/06/16/Tc5ve5Op.jpg', alt: '照片11' },
            { id: 'UJaeQlPn', url: 'https://s3.bmp.ovh/2026/06/16/UJaeQlPn.jpg', alt: '照片12' }
        ];

        // ============================================================
        // 2. 状态变量
        // ============================================================
        const wrap = document.getElementById('stackWrap');
        let stackedCards = [];   // 堆叠中的卡片（按底层到顶层顺序）
        let freeCards = [];      // 已拖出的卡片
        let dragData = null;
        const DRAG_THRESHOLD = 8;
        const OFFSET_X = 6;
        const OFFSET_ROTATE = 2.5;

        // ============================================================
        // 3. 创建卡片
        // ============================================================
        function createCard(data, index) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.dataset.id = data.id;
            card.dataset.index = index;
            card.style.position = 'absolute';
            card.style.width = '100%';
            card.style.height = '100%';

            const img = document.createElement('img');
            img.src = data.url;
            img.alt = data.alt;
            img.loading = 'lazy';
            card.appendChild(img);

            card.addEventListener('mousedown', onPointerDown);
            card.addEventListener('touchstart', onPointerDown, { passive: false });

            return card;
        }

        // ============================================================
        // 4. 堆叠布局（只针对 stackedCards）
        // ============================================================
        function layoutStack() {
            const count = stackedCards.length;
            stackedCards.forEach((card, idx) => {
                const base = count - idx - 1;
                const tx = base * OFFSET_X;
                const ty = base * OFFSET_X;
                const rot = base * OFFSET_ROTATE;
                card.style.zIndex = idx + 1;
                card.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg)`;
                card.style.opacity = '1';
                card.style.pointerEvents = 'auto';
            });
        }

        // ============================================================
        // 5. 拖拽逻辑
        // ============================================================
        function onPointerDown(e) {
            e.preventDefault();
            const card = e.currentTarget;
            const touch = e.touches ? e.touches[0] : e;
            const startX = touch.clientX;
            const startY = touch.clientY;

            // 禁用该卡片的过渡（拖拽跟手）
            card.style.transition = 'none';

            dragData = {
                card: card,
                startX: startX,
                startY: startY,
                moved: false,
                offsetX: 0,
                offsetY: 0,
                transformX: 0,
                transformY: 0
            };

            const rect = card.getBoundingClientRect();
            const wrapRect = wrap.getBoundingClientRect();
            dragData.offsetX = rect.left - wrapRect.left;
            dragData.offsetY = rect.top - wrapRect.top;

            card.style.zIndex = 9999;

            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            document.addEventListener('touchmove', onPointerMove, { passive: false });
            document.addEventListener('touchend', onPointerUp);
            document.addEventListener('touchcancel', onPointerUp);
        }

        function onPointerMove(e) {
            if (!dragData) return;
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            const dx = touch.clientX - dragData.startX;
            const dy = touch.clientY - dragData.startY;

            if (!dragData.moved && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
                dragData.moved = true;
            }

            if (dragData.moved) {
                const card = dragData.card;
                const newX = dragData.offsetX + dx;
                const newY = dragData.offsetY + dy;
                card.style.transform = `translate(${newX}px, ${newY}px) scale(1.04) rotate(0deg)`;
                dragData.transformX = newX;
                dragData.transformY = newY;
            }
        }

        function onPointerUp(e) {
            if (!dragData) return;
            const card = dragData.card;
            const moved = dragData.moved;

            document.removeEventListener('mousemove', onPointerMove);
            document.removeEventListener('mouseup', onPointerUp);
            document.removeEventListener('touchmove', onPointerMove);
            document.removeEventListener('touchend', onPointerUp);
            document.removeEventListener('touchcancel', onPointerUp);

            // 恢复过渡（为后续收回动画做准备）
            card.style.transition = '';

            if (!moved) {
                // 点击 -> 打开模态框
                openModal(card.querySelector('img').src);
                // 如果是堆叠中的卡片，重置其位置（但未移动，保持原样）
                // 但可能因为点击时禁用过渡导致轻微偏移？无需处理
                dragData = null;
                return;
            }

            // ---- 拖动结束，该卡片成为自由卡片 ----
            const idxInStack = stackedCards.indexOf(card);
            if (idxInStack !== -1) {
                stackedCards.splice(idxInStack, 1);
                freeCards.push(card);
                // 移出堆叠，追加到容器末尾（保持DOM顺序）
                wrap.removeChild(card);
                wrap.appendChild(card);
                // 保持当前transform，并设置zIndex
                card.style.transform = `translate(${dragData.transformX}px, ${dragData.transformY}px) scale(1) rotate(0deg)`;
                card.style.zIndex = 1000 + freeCards.length;
                // 重新布局堆叠
                layoutStack();
                // 确保所有自由卡片zIndex高于堆叠
                freeCards.forEach((fc, i) => {
                    fc.style.zIndex = 1000 + i;
                });
            } else {
                // 如果已经是自由卡片，仅更新transform
                card.style.transform = `translate(${dragData.transformX}px, ${dragData.transformY}px) scale(1) rotate(0deg)`;
            }

            dragData = null;
        }

        // ============================================================
        // 6. 收回全部卡片（双击空白处触发）
        // ============================================================
        function retractAllCards() {
            if (freeCards.length === 0) return;

            // 将所有自由卡片移回堆叠数组
            freeCards.forEach(card => {
                stackedCards.push(card);
            });
            freeCards = [];

            // 按原始索引排序，保持顺序
            stackedCards.sort((a, b) => Number(a.dataset.index) - Number(b.dataset.index));

            // 重新构建DOM：清空wrap，按顺序追加所有卡片
            wrap.innerHTML = '';
            stackedCards.forEach(card => wrap.appendChild(card));

            // 确保所有卡片都有过渡（可能有些卡片在拖拽时被禁用了过渡，但我们已经恢复）
            // 但为了保险，显式启用过渡（使用默认样式）
            stackedCards.forEach(card => {
                card.style.transition = '';
                card.style.zIndex = '';   // 将由layoutStack设置
            });

            // 应用堆叠布局（触发过渡动画）
            layoutStack();
        }

        // 监听容器双击空白区域
        wrap.addEventListener('dblclick', function(e) {
            // 如果点击目标是卡片或其子元素，则不触发收回
            if (e.target.closest('.photo-card')) return;
            retractAllCards();
        });

        // ============================================================
        // 7. 模态框
        // ============================================================
        const modalOverlay = document.getElementById('modalOverlay');
        const modalImage = document.getElementById('modalImage');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        function openModal(src) {
            modalImage.src = src;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalCloseBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        // 8. 初始化
        // ============================================================
        function init() {
            const cards = imageList.map((data, idx) => createCard(data, idx));
            stackedCards = cards.slice();
            freeCards = [];
            cards.forEach(card => wrap.appendChild(card));
            layoutStack();
        }
        init();

        // ============================================================
        // 9. 音乐控制（保持不变）
        // ============================================================
        const musicBtn = document.getElementById('musicBtn');
        const bgMusic = document.getElementById('bgMusic');
        let isPlaying = false;
        let initMusicFlag = false;

        const initMusic = () => {
            if (initMusicFlag) return;
            initMusicFlag = true;
            bgMusic.play().then(() => {
                isPlaying = true;
                musicBtn.textContent = '🔇';
            }).catch(err => {
                musicBtn.textContent = '🎵';
                isPlaying = false;
            });
            document.removeEventListener('click', initMusic);
            document.removeEventListener('touchstart', initMusic);
        };
        document.addEventListener('click', initMusic, { once: true });
        document.addEventListener('touchstart', initMusic, { once: true, passive: true });

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicBtn.textContent = '🎵';
                isPlaying = false;
            } else {
                bgMusic.play().catch(initMusic);
                musicBtn.textContent = '🔇';
                isPlaying = true;
            }
        }
        musicBtn.addEventListener('click', toggleMusic);
        musicBtn.addEventListener('touchstart', e => { e.preventDefault(); toggleMusic(); }, { passive: false });
        bgMusic.addEventListener('play', () => { isPlaying = true; musicBtn.textContent = '🔇'; });
        bgMusic.addEventListener('pause', () => { isPlaying = false; musicBtn.textContent = '🎵'; });
        bgMusic.addEventListener('error', () => {
            musicBtn.textContent = '❌';
            musicBtn.style.color = '#ff4d4f';
        });
    </script>
</body>
</html>
