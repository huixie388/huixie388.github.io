<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>宸宇的website</title>
    <style>
        /* 全局样式 - 统一主题 */
        :root {
            --primary: #4299e1;
            --primary-light: rgba(66, 153, 225, 0.15);
            --primary-shadow: rgba(66, 153, 225, 0.25);
            --bg: linear-gradient(150deg, #f8fafc, #f1f5f9);
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.03);
            --shadow-heavy: 0 15px 30px rgba(0, 0, 0, 0.08);
            --shadow-primary: 0 8px 20px var(--primary-shadow);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", "微软雅黑", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            color: var(--text-main);
            padding-bottom: env(safe-area-inset-bottom);
            touch-action: manipulation;
        }

        /* 音乐控制按钮 - 适配双端触摸/点击 */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            font-size: 20px;
            color: var(--primary);
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .music-control:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-primary);
            border-color: var(--primary);
        }
        .music-control:active {
            transform: scale(0.95);
        }

        /* 时间模块 */
        .time-box {
            text-align: center;
            margin-bottom: 20px;
            pointer-events: none;
        }
        .time {
            font-size: clamp(24px, 6vmin, 36px);
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 2px;
            text-shadow: 0 2px 8px var(--primary-light);
        }
        .date {
            font-size: clamp(14px, 3vmin, 16px);
            color: var(--text-secondary);
            margin-top: 8px;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        /* 标题区域 */
        .nav-header {
            text-align: center;
            margin-bottom: 50px;
            pointer-events: none;
            width: 100%;
            max-width: 800px;
        }
        .nav-header h1 {
            font-size: clamp(32px, 8vmin, 48px);
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(90deg, var(--text-main), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
            line-height: 1.2;
        }
        .nav-header p {
            font-size: clamp(14px, 3vmin, 17px);
            color: var(--text-secondary);
            line-height: 1.6;
            letter-spacing: 0.5px;
            padding: 0 10px;
        }

        /* 导航容器 - 优化移动端网格布局 */
        .nav-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 950px;
        }

        /* 卡片核心 - 双端交互优化 */
        .nav-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: var(--shadow-light), 0 0 0 0 rgba(0, 0, 0, 0);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(10px);
            min-height: 220px; /* 保证移动端卡片高度一致 */
        }
        .nav-card:hover, .nav-card:focus {
            transform: translateY(-10px) scale(1.025);
            border-color: var(--primary);
            box-shadow: var(--shadow-heavy), var(--shadow-primary);
        }
        .nav-card:active {
            transform: translateY(-5px) scale(0.98);
        }
        .nav-card a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            color: inherit;
            text-decoration: none;
            height: 100%;
            width: 100%;
            position: relative;
            z-index: 2;
        }
        .card-icon {
            font-size: clamp(40px, 10vmin, 56px);
            margin-bottom: 20px;
            text-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
            transform: rotate(0deg);
        }
        .nav-card:hover .card-icon, .nav-card:focus .card-icon {
            transform: rotate(5deg) scale(1.1);
            color: var(--primary);
        }
        .card-name {
            font-size: clamp(18px, 4vmin, 20px);
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            letter-spacing: 0.3px;
            text-align: center;
        }
        .card-desc {
            font-size: clamp(12px, 3vmin, 14px);
            font-weight: 400;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.7;
            max-width: 200px;
            padding: 0 5px;
        }

        .nav-footer {
            margin-top: 70px;
            font-size: clamp(12px, 3vmin, 14px);
            color: var(--text-secondary);
            text-align: center;
            pointer-events: none;
            letter-spacing: 0.5px;
            width: 100%;
            padding: 0 20px 20px;
        }

        /* 音频元素隐藏优化 */
        audio {
            display: none !important;
        }

        /* 移动端专项适配 */
        @media (max-width: 768px) {
            body {
                padding: 40px 16px;
                justify-content: flex-start;
            }
            .music-control {
                width: 45px;
                height: 45px;
                font-size: 18px;
                top: 15px;
                right: 15px;
            }
            .time-box {
                margin-top: 20px;
                margin-bottom: 15px;
            }
            .nav-header {
                margin-bottom: 35px;
            }
            .nav-container {
                gap: 18px;
            }
            .nav-card a {
                padding: 25px 16px;
            }
            .nav-card:hover, .nav-card:focus {
                transform: translateY(-8px) scale(1.01);
            }
            .nav-footer {
                margin-top: 50px;
                font-size: 13px;
            }
        }

        /* 小屏手机适配 */
        @media (max-width: 375px) {
            .nav-container {
                grid-template-columns: 1fr;
            }
            .card-icon {
                font-size: 40px;
            }
            .nav-header h1 {
                font-size: clamp(28px, 10vmin, 36px);
            }
        }
    </style>
</head>
<body>
    <!-- 音乐控制按钮（双端兼容） -->
    <div class="music-control" id="musicBtn" tabindex="0">🎵</div>
    <!-- 音频元素（双端兼容格式） -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://raw.githubusercontent.com/huixie388/huixie388.github.io/main/music/BGM2.mp3" type="audio/mpeg">
        <source src="https://raw.githubusercontent.com/huixie388/huixie388.github.io/main/music/BGM2.ogg" type="audio/ogg">
        你的浏览器不支持音频播放
    </audio>

    <div class="time-box">
        <div class="time" id="realTime">00:00:00</div>
        <div class="date" id="realDate">2026-01-01 星期三</div>
    </div>

    <div class="nav-header">
        <h1>欢迎来到宸宇的website</h1>
        <p>宸宇的项目集 / 一站式快速访问</p>
    </div>

    <div class="nav-container">
        <!-- 原有六个卡片（完全未动） -->
        <div class="nav-card">
            <a href="horse2026" tabindex="0">
                <div class="card-icon">🐴</div>
                <div class="card-name">2026马年祝福</div>
                <div class="card-desc">动态交互新春弹窗 | 3D鼠标跟随+音乐</div>
            </a>
        </div>
        <div class="nav-card">
            <a href="birthday" tabindex="0">
                <div class="card-icon">🎂</div>
                <div class="card-name">生日贺卡</div>
                <div class="card-desc">专属定制生日页面 | 动态文字+背景</div>
            </a>
        </div>
        <div class="nav-card">
            <a href="love" tabindex="0">
                <div class="card-icon">❤️</div>
                <div class="card-name">爱心弹窗</div>
                <div class="card-desc">前端小工具 | 一个人想着一个人</div>
            </a>
        </div>
        <div class="nav-card">
            <a href="test" tabindex="0">
                <div class="card-icon">✨</div>
                <div class="card-name">测试页面</div>
                <div class="card-desc">静态页面示例 | 基础样式测试</div>
            </a>
        </div>
        <div class="nav-card">
            <a href="album" tabindex="0">
                <div class="card-icon">📸</div>
                <div class="card-name">相册集</div>
                <div class="card-desc">个人照片展示 | 动态相册</div>
            </a>
        </div>
        <div class="nav-card">
            <a href="todo" tabindex="0">
                <div class="card-icon">📝</div>
                <div class="card-name">待办清单</div>
                <div class="card-desc">个人任务管理 | 实时同步</div>
            </a>
        </div>

        <!-- 新增：俄罗斯方块卡片（仅增加此块，其他不变） -->
        <div class="nav-card">
            <a href="tetris.html" tabindex="0">
                <div class="card-icon">🎮</div>
                <div class="card-name">俄罗斯方块</div>
                <div class="card-desc">经典彩色下落式 | 难度可选 + 落点影子</div>
            </a>
        </div>
    </div>

    <div class="nav-footer">
        © 2026 宸宇的website | 要天天开心哦
    </div>

    <script>
        // 时间显示功能（原样保留）
        const timeEl = document.getElementById('realTime');
        const dateEl = document.getElementById('realDate');

        const formatNum = (num) => num.toString().padStart(2, '0');
        const getWeek = (n) => {
            const weekList = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            return weekList[n] || '星期一';
        };

        const updateTime = () => {
            try {
                const now = new Date();
                const hours = formatNum(now.getHours());
                const minutes = formatNum(now.getMinutes());
                const seconds = formatNum(now.getSeconds());
                const time = `${hours}:${minutes}:${seconds}`;
                
                const year = now.getFullYear();
                const month = formatNum(now.getMonth() + 1);
                const day = formatNum(now.getDate());
                const week = getWeek(now.getDay());
                const solarDate = `${year}-${month}-${day} ${week}`;

                timeEl.innerText = time;
                dateEl.textContent = solarDate;
            } catch (err) {
                console.log('时间更新失败:', err);
                timeEl.innerText = '00:00:00';
                dateEl.textContent = '2026-01-01 星期三';
            }
        };

        updateTime();
        setInterval(updateTime, 1000);

        // 背景音乐控制（原样保留）
        const musicBtn = document.getElementById('musicBtn');
        const bgMusic = document.getElementById('bgMusic');
        let isPlaying = false;
        let initMusicFlag = false;

        const initMusic = () => {
            if (initMusicFlag) return;
            initMusicFlag = true;

            bgMusic.play().then(() => {
                isPlaying = true;
                musicBtn.textContent = '🔇';
            }).catch(err => {
                console.log('音频初始化失败，需手动点击播放:', err);
                musicBtn.textContent = '🎵';
            });

            document.removeEventListener('click', initMusic);
            document.removeEventListener('touchstart', initMusic);
            document.removeEventListener('keydown', initMusic);
        };

        document.addEventListener('click', initMusic, { once: true });
        document.addEventListener('touchstart', initMusic, { once: true, passive: true });
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') initMusic();
        }, { once: true });

        musicBtn.addEventListener('click', toggleMusic);
        musicBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            toggleMusic();
        }, { passive: false });
        musicBtn.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleMusic();
            }
        });

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicBtn.textContent = '🎵';
            } else {
                bgMusic.play().catch(err => {
                    console.log('播放失败，需先获取权限:', err);
                    initMusic();
                });
                musicBtn.textContent = '🔇';
            }
            isPlaying = !isPlaying;
        }

        bgMusic.addEventListener('play', () => {
            isPlaying = true;
            musicBtn.textContent = '🔇';
        });

        bgMusic.addEventListener('pause', () => {
            isPlaying = false;
            musicBtn.textContent = '🎵';
        });

        bgMusic.addEventListener('error', () => {
            console.log('音频文件加载失败');
            musicBtn.textContent = '❌';
            musicBtn.style.color = '#ff4d4f';
        });
    </script>
</body>
</html>
